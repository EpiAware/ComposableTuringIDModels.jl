# MANAGED by EpiAwarePackageTools.scaffold — do not edit by hand.
# Coverage is reported under flags so the main unit suite and each
# per-backend AD gradient suite stay separately attributable (own Codecov
# badge each) while still rolling up into one project total.
#
# `carryforward: true` keeps a flag's last value when a run doesn't
# re-upload it: `unit` and each AD job upload independently, so without it
# a run posting only some flags would blank the others.
#
# The 8 flag uploads arrive from separate workflows minutes
# apart; Codecov recomputes status on every upload, so without a gate it
# posts an early FAILURE from a partial session set. `after_n_builds` holds
# the notification until all uploads are in; `wait_for_ci` keeps Codecov
# from finalising before CI reports. `auto` targets compare against the
# parent commit with a small threshold.
#
# `unit` claims the whole `ext` directory; the AD flags claim `src` only.
# Most AD jobs run without weakdeps loaded, so extension files never execute
# there and an `ext` path under those `ad-*` flags would report 0% and drag
# the aggregate down (#180). An Enzyme rule-file extension only ever loads
# under the Enzyme AD jobs, so `ad-enzyme-forward`/`ad-enzyme-reverse` also
# name that one file. They name the file, not the directory: a directory
# claim would charge them for every other extension too (#416).
codecov:
  notify:
    after_n_builds: 8
    wait_for_ci: true

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 1%

comment:
  after_n_builds: 8

flags:
  unit:
    paths:
      - src
      - ext
    carryforward: true
  ad-forwarddiff:
    paths:
      - src
    carryforward: true
  ad-reversediff:
    paths:
      - src
    carryforward: true
  ad-reversediff-compiled:
    paths:
      - src
    carryforward: true
  ad-enzyme-forward:
    paths:
      - src
      - ext/ComposableTuringIDModelsEnzymeExt.jl
    carryforward: true
  ad-enzyme-reverse:
    paths:
      - src
      - ext/ComposableTuringIDModelsEnzymeExt.jl
    carryforward: true
  ad-mooncake-reverse:
    paths:
      - src
    carryforward: true
  ad-mooncake-forward:
    paths:
      - src
    carryforward: true
