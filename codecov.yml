# Generated by EpiAwarePackageTools.scaffold, then edited by hand to add the
# seventh AD backend. `scaffold`'s `_AD_BACKENDS` lists six, so `update()` will
# revert this file and `.github/workflows/ad.yaml` together until the kit
# carries `ReverseDiff (compiled)`.
#
# Coverage is reported under flags so the main unit suite and each
# per-backend AD gradient suite stay separately attributable (each gets
# its own Codecov badge) while still rolling up into one project total.
#
# `carryforward: true` keeps a flag's last value when a given workflow run
# does not re-upload it: the `unit` job (codecoverage.yaml) and each AD job
# (ad.yaml, one per `_AD_BACKENDS` entry) run and upload independently, so
# without carryforward a run that posts only some flags would blank the
# others.
#
# The 8 flag uploads (unit + one per AD backend) arrive from separate
# workflows that finish minutes apart. Codecov recomputes the patch/project
# status on every upload, so without a gate it posts an early FAILURE from a
# partial session set, and which flag decides the status becomes a race.
# `after_n_builds` must therefore match the upload count exactly;
# `wait_for_ci` keeps Codecov from finalising before CI itself reports.
#
# A flag claims `ext` only if its job loads the extension. The Enzyme jobs do;
# the other AD jobs run without the weakdeps, so `ext` would report 0% there
# and drag the aggregate down.
codecov:
  notify:
    after_n_builds: 8
    wait_for_ci: true

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 1%

comment:
  after_n_builds: 8

flags:
  unit:
    paths:
      - src
      - ext
    carryforward: true
  ad-forwarddiff:
    paths:
      - src
    carryforward: true
  ad-reversediff:
    paths:
      - src
    carryforward: true
  ad-reversediff-compiled:
    paths:
      - src
    carryforward: true
  # The Enzyme jobs are the only ones that load the extension, so they are the
  # only ones that can report on `ext`.
  ad-enzyme-forward:
    paths:
      - src
      - ext
    carryforward: true
  ad-enzyme-reverse:
    paths:
      - src
      - ext
    carryforward: true
  ad-mooncake-reverse:
    paths:
      - src
    carryforward: true
  ad-mooncake-forward:
    paths:
      - src
    carryforward: true
