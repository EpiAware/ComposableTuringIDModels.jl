# MANAGED by EpiAwarePackageTools.scaffold — do not edit by hand.
repos:
#####
# Basic file cleanliness
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: check-added-large-files
    # `templates/` holds files with `{{PLACEHOLDER}}` tokens that are not
    # valid YAML/TOML until substituted, so exclude that tree from the
    # structural parsers. Absent (no-op) in a normal package.
    -   id: check-yaml
        exclude: '^templates/'
    -   id: check-toml
        exclude: '^templates/'
    # `--assume-in-merge` runs the check on every commit, not only during a
    # merge (the default only fires when `.git/MERGE_HEAD` exists) — without
    # it a stray conflict marker committed after a resolve, or with
    # `--no-verify`, sails through, as happened on #250 (#251).
    -   id: check-merge-conflict
        args: [--assume-in-merge]
    -   id: check-json
    -   id: debug-statements
    -   id: end-of-file-fixer
    -   id: mixed-line-ending
    -   id: trailing-whitespace
#####
# Conflict markers the stock hook misses
# `check-merge-conflict` only looks for `<<<<<<<`, `=======` and `>>>>>>>`; a
# `diff3`/`zdiff3` style also emits a `|||||||` base marker, which it misses
# and which reached CI on #250. Forbid it explicitly: seven pipes at the
# start of a line is the marker's shape and doesn't occur in real code or
# markdown tables (#251).
- repo: local
  hooks:
  - id: forbid-diff3-base-marker
    name: forbid diff3 conflict base marker
    entry: '^\|\|\|\|\|\|\|'
    language: pygrep
    types: [text]
#####
# Julia
# Runic builds its own hook environment from `additional_dependencies`, so
# the pinned version here is the single source `runic-check.yml` greps the
# repo for. Keep it in step with the isolated formatter test environment.
- repo: https://github.com/fredrikekre/runic-pre-commit
  rev: v2.2.0
  hooks:
  - id: runic
    additional_dependencies: ['Runic@1.7.0']
    # Runic is AST-based and errors rather than skips on the `{{PLACEHOLDER}}`
    # tokens in templates/, which are not valid Julia until substituted.
    # No-op in a normal package.
    exclude: '^templates/'
#####
# Secrets
-   repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
    -   id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: '.*/Manifest\.toml$'
