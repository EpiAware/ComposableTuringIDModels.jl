# Generated by EpiAwarePackageTools.scaffold, then edited by hand: `backends`
# below carries a seventh entry, `ReverseDiff (compiled)`, that the kit's
# `_AD_BACKENDS` does not. `codecov.yml` is edited to match. `update()` reverts
# both until the kit carries that backend.
name: AD

# Drives the per-backend AD gradient matrix (the shipped `test/ad/` harness).
# The per-flag coverage upload and job mechanics live in the reusable; this is
# the thin caller. Without it the AD harness the kit ships never runs in CI.
#
# `backends` is passed explicitly rather than left to the reusable's own
# default, so the matrix stays in step with the `codecov.yml` flags. Both are
# maintained together; `codecov.yml`'s `after_n_builds` counts these backends
# plus the unit upload.

on:
  push:
    branches: [main]
    # Don't fire the 7-backend AD sweep (the heaviest, slowest matrix) for
    # changes that cannot alter a gradient result. Only clearly AD-irrelevant
    # paths are ignored: prose docs and markdown. Anything touching src/,
    # ext/, test/, Project.toml, benchmark/ or the workflow itself still
    # triggers the full matrix. paths-ignore only skips when EVERY changed
    # file matches, so a mixed docs+src PR still runs.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ad:
    uses: EpiAware/.github/.github/workflows/ad.yml@d024dc6927cc3523292a159dc0d4a45193c9c65d
    with:
      backends: '[{"name":"ForwardDiff","tag":"forwarddiff","flag":"ad-forwarddiff"},{"name":"ReverseDiff (compiled)","tag":"reversediff_compiled","flag":"ad-reversediff-compiled"},{"name":"ReverseDiff (tape)","tag":"reversediff","flag":"ad-reversediff"},{"name":"Enzyme forward","tag":"enzyme_forward","flag":"ad-enzyme-forward"},{"name":"Enzyme reverse","tag":"enzyme_reverse","flag":"ad-enzyme-reverse"},{"name":"Mooncake reverse","tag":"mooncake_reverse","flag":"ad-mooncake-reverse"},{"name":"Mooncake forward","tag":"mooncake_forward","flag":"ad-mooncake-forward"}]'
    secrets: inherit  # pragma: allowlist secret
