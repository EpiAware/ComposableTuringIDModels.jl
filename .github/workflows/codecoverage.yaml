# MANAGED by EpiAwarePackageTools.scaffold — do not edit by hand.
name: Code coverage

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    uses: EpiAware/.github/.github/workflows/coverage.yml@8c1e09003b9cf0d2eb3cbec7aa726855bb365ac5
    with:
      julia_version: '1'
      # Hard-fail the coverage check on an upload error: a repo with no
      # CODECOV_TOKEN cannot upload on a protected branch, so CI goes red as
      # a reminder to add the secret (repo or org).
      fail_ci_if_error: true
    secrets: inherit  # pragma: allowlist secret
