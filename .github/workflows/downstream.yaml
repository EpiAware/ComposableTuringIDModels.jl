# MANAGED by EpiAwarePackageTools.scaffold — do not edit by hand.
name: Downstream

# Opt-in reverse-dependency tests: checks that this PR's version of the
# package does not break packages that depend on it. Expensive, so it
# doesn't run on every push. Trigger via the `downstream` (or `reverse-deps`)
# PR label, or manually from the Actions tab.
#
# `downstreams` below starts empty; add entries as packages start depending
# on this one (see the commented example) and label a PR to run them. This
# list is package-owned — `update` preserves it while the rest of the file
# stays managed.

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  downstream:
    # Only the opt-in label triggers on PRs; manual dispatch always runs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'downstream' ||
      github.event.label.name == 'reverse-deps'
    uses: EpiAware/.github/.github/workflows/downstream.yml@8c1e09003b9cf0d2eb3cbec7aa726855bb365ac5
    secrets: inherit  # pragma: allowlist secret
    with:
      # JSON list of downstreams. Each entry needs `repo` (owner/name) and may
      # set `group` (GROUP env for the downstream suite) and `allow_fail` (true
      # keeps a failure from reding the run). Empty by default; e.g.:
      #   [{"repo":"EpiAware/SomeDownstream.jl","group":"All"}]
      downstreams: '[]'
